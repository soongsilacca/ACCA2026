# Mounting pose supplied in MORAI (base_link -> rear_lidar).
sensor_x: -0.73
sensor_y: 0.0
sensor_z: 0.22
sensor_roll: 0.0
sensor_pitch: 0.0
sensor_yaw: 0.0

# Use the normal localization result when the dedicated MORAI UDP odometry
# receiver cannot bind port 9009 or is not launched.
fallback_odom_topic: /localization/kinematic_state
# Reuse the normal MORAI bridge when it already owns UDP port 9009.
ego_status_topic: /morai/ego_vehicle_status

# Rear/adjacent-lane region in base_link.  base_link is at the rear axle in
# this vehicle: rear bumper ~= -0.79 m, front bumper ~= +3.845 m.  The padded
# self-filter therefore lies mostly in front of the origin.
roi_min_x: -80.0
roi_max_x: 5.0
roi_min_y: -12.0
roi_max_y: 12.0
roi_min_z: -1.0
roi_max_z: 4.0
vehicle_min_x: -1.05
vehicle_max_x: 4.10
vehicle_min_y: -1.15
vehicle_max_y: 1.15

# Road plane removal after transforming the scan into base_link.
ground_distance_threshold: 0.16
ground_max_tilt_deg: 12.0
# Existing front pipeline uses a 0.68 m LiDAR height while its base_link TF is
# z=0.22, placing the road near z=-0.46 after conversion to base_link.
expected_ground_z: -0.46
ground_height_tolerance: 0.40
ground_max_iterations: 120

# Only large vertical planes are called walls.  This preserves ordinary car
# side panels while rejecting barriers and building faces.
wall_distance_threshold: 0.12
wall_max_normal_z: 0.30
wall_min_inliers: 100
wall_min_length: 10.0
wall_min_height: 0.70
wall_bin_size: 0.50
wall_min_occupancy_ratio: 0.60
wall_max_planes: 3

voxel_leaf_size: 0.20
cluster_tolerance: 0.70
cluster_range_scale: 0.010
max_cluster_tolerance: 1.50
min_cluster_points: 5
max_cluster_points: 12000
min_object_height: 0.20
max_object_height: 4.0
min_object_planar_size: 0.10
max_object_length: 15.0
max_object_width: 6.0
sparse_detection_range: 30.0
sparse_assumed_height: 0.80

# Constant-velocity alpha-beta tracker.
association_distance: 2.5
track_alpha: 0.65
track_beta: 0.20
min_confirmed_hits: 2
max_missed_frames: 5
dynamic_speed_threshold: 0.8
prediction_horizon: 4.0
prediction_dt: 0.5
max_odom_age: 0.5

enable_ground_filter: true
enable_wall_filter: true
publish_debug_clouds: true
