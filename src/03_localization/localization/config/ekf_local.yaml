frequency: 20
sensor_timeout: 0.2
transform_timeout: 0.05
transform_time_offset: 0.0
two_d_mode: true
publish_tf: true

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: odom

#                    x     y     z
#                    roll  pitch yaw
#                    vx    vy    vz
#                    vr    vp    vyaw
#                    ax    ay    az


# 1. Wheel Odometry
odom0: /wheel_odometry
odom0_config: [true,  true,  false,
               false, false, false,
               true,  false, false,
               false, false, true,
               false, false, false]
odom0_differential: false
odom0_relative: false

# 2. IMU
imu0: /imu
imu0_config: [false, false, false,
              false, false, true,
              false, false, false,
              false, false, true,
              false, false, false]
imu0_differential: false
imu0_relative: false

