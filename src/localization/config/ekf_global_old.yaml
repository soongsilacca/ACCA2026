frequency: 15
sensor_timeout: 0.2
transform_timeout: 0.05
transform_time_offset: 0.0
two_d_mode: true
publish_tf: true

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map  # Global EKF → map->odom TF 발행

#                    x     y     z
#                    roll  pitch yaw
#                    vx    vy    vz
#                    vr    vp    vyaw
#                    ax    ay    az

# 1. GPS Pose (x, y만 사용 → 위치 보정, rotation 없음)
pose0: /gps_pose
pose0_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
pose0_differential: false
pose0_relative: false

# 2. Wheel odometry is fused only in the local EKF.
#    Keeping it out of the global EKF avoids odom->base_link TF lookups inside
#    the map filter and removes startup timing/update-rate warnings.

odom0: /wheel_odometry
odom0_config: [false,  false,  false,
               false, false, false,
               true,  false, false,
               false, false, true,
               false, false, false]
odom0_differential: false
odom0_relative: false

# 2. IMU yaw
#    map frame is fixed by GPS/map_anchor; yaw comes from IMU.
imu0: /imu
imu0_config: [false, false, false,
              false, false, true,
              false, false, false,
              false, false, false,
              false, false, false]
imu0_differential: false
imu0_relative: false

# 3. NDT Pose (nav_msgs/Odometry)
# odom1: /ndt_pose
# odom1_config: [true,  true,  false,
#                false, false, false,
#                false, false, false,
#                false, false, false,
#                false, false, false]
