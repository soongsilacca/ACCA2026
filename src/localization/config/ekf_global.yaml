frequency: 15
sensor_timeout: 0.2
transform_timeout: 0.05
transform_time_offset: 0.0
two_d_mode: true
publish_tf: true

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map  # Global EKF → map->odom TF 발행

#                    x     y     z
#                    roll  pitch yaw
#                    vx    vy    vz
#                    vr    vp    vyaw
#                    ax    ay    az

# 1. GPS Pose (x, y만 사용 → 위치 보정, rotation 없음)
pose0: /gps_pose
pose0_config: [true,  true,  false,
               false, false, false,
               false, false, false,
               false, false, false,
               false, false, false]
pose0_differential: false
pose0_relative: false

# 2. Wheel Odometry — 속도 성분(vx, vyaw)만 Global EKF에 fusion
#
#    목적 : GPS 블랙아웃 중에도 map→odom TF 를 dead-reckoning으로 유지.
#
#    x, y(위치)는 비활성화:
#      /wheel_odometry 의 pose.x/y 는 odom 프레임 기준 누적 거리이므로
#      map 프레임 절대 위치로 잘못 해석되지 않도록 반드시 false.
#      위치 보정은 GPS가 있을 때 pose0(/gps_pose)가 담당한다.
#
#    vx, vyaw(속도)만 활성화:
#      속도는 프레임 독립적(body frame)이므로 Global EKF 에 직접 사용 가능.
#      GPS 없이도 속도 적분으로 map→odom TF 를 계속 갱신한다.

odom0: /wheel_odometry
odom0_config: [true,  true,  false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom0_differential: true
odom0_relative: false

# 2. IMU yaw
#    map frame is fixed by GPS/map_anchor; yaw comes from IMU.
imu0: /imu
imu0_config: [false, false, false,
              false, false, true,
              false, false, false,
              false, false, false,
              false, false, false]
imu0_differential: false
imu0_relative: false

# 3. NDT Pose (nav_msgs/Odometry)
