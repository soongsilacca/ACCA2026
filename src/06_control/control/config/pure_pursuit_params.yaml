# Pure Pursuit Controller Parameters
#
# ┌─────────────────────────────────────────────────────────────────┐
# │  알고리즘: δ = atan(2 * L * sin(α) / L_d)                      │
# │  L_d = k_ld * v + L_d_min  (속도 비례)                         │
# │                                                                 │
# │  속도 적응형 EMA:                                                │
# │    alpha = alpha_low + (alpha_high - alpha_low) * exp(-v/v_ref) │
# │    v=0   → alpha ≈ alpha_high (빠른 반응)                        │
# │    v=8   → alpha ≈ alpha_low+(high-low)*e^-1 ≈ 0.45             │
# │    v=16+ → alpha ≈ alpha_low  (강한 필터링)                      │
# │                                                                 │
# │  튜닝 가이드:                                                    │
# │    커브에서 늦게 꺾음 → k_ld ↓ 또는 L_d_min ↓                  │
# │    고속 oscillation  → steer_alpha_low ↓ 또는 alpha_speed ↑    │
# └─────────────────────────────────────────────────────────────────┘

pure_pursuit:
  # ---- Lookahead (속도 적응형) ----------------------------------------
  # v=15m/s → L_d = 0.15*15 + 4.0 = 6.25m
  # (L_d_min을 올려 100ms latency 동안 이동거리 1.67m를 보상)
  k_ld:    0.15
  L_d_min: 4.0     # 최소 lookahead [m]  (올려서 latency 보상)
  L_d_max: 10.0

  # ---- 속도 적응형 EMA 필터 -------------------------------------------
  steer_alpha_low:   0.30   # 고속에서 적용 (강한 평활화 → oscillation 억제)
  steer_alpha_high:  0.70   # 저속에서 적용 (빠른 반응)
  steer_alpha_speed: 8.0    # 전환 기준 속도 [m/s]  (≈ 28.8 km/h)
  #
  # 속도별 alpha 예시:
  #   v= 0 m/s → alpha ≈ 0.70
  #   v= 8 m/s → alpha ≈ 0.45
  #   v=15 m/s → alpha ≈ 0.33
  #   v=20 m/s → alpha ≈ 0.31

  # ---- 가속/제동 -------------------------------------------------------
  accel_value: 0.4

  # ---- 조향 제한 -------------------------------------------------------
  max_steer_deg: 40.0

  # ---- 제어 주파수 -----------------------------------------------------
  # odom 10 Hz 에 맞춰 10 Hz
  control_hz: 10.0

  # ---- 인덱스 점프 방지 ------------------------------------------------
  max_idx_jump: 10
