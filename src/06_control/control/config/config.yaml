# 1. 차량 기본 제원 및 제어 주기
wheelbase: 3.0
dt: 0.05
nx: 3
nu: 2
T: 80

# 2. 최종 목적지 터미널 가중치 (Qf)
qf_ct: 10.0
qf_v: 20.0
qf_yaw: 10.0

# 3. 하드웨어 물리 제약조건 값들
max_accel: 5.0
max_brake: 5.0
max_steer: 0.69813    # 라디안 단위 (약 40도)
max_dsteer: 1.5       # 초당 조향각 변동률 제한 (rad/s)
min_speed: 0.0
max_speed: 20.0

# 4. 스탠리 게인 값
stanley_kv: 0.25        # 저속 댐핑 안정화 게인
stanley_h_gain: 1.0     # 헤딩 에러 가중치 게인 
stanley_c_gain: 0.5     # 크로스트랙 에러 가중치 게인

# 5. PI 제어 게인 값
kp: 1.5                 # 비례제어 게인
ki: 1.0                 # 적분제어 게인

# 6. Adaptive MPC Weight

# Base Weight (안정적인 정밀 추종 및 조향 밸런스)
q_ct_base: 20.0    # 경로 추종 가중치 (경로 밀착)
q_v_base: 20.0     # 속도 추종 반응성
q_yaw_base: 8.0    # 헤딩 복귀 가중치

r_accel_base: 0.1  # 가속 페널티
r_steer_base: 2.0  # 조향 페널티 (정상 조향 핸들링 확보)

# Adaptive Gain
k_cte: 0.1
k_cte_dot: 0.1

k_yaw: 0.6
k_yaw_dot: 0.6

k_curve: 15.0

k_steer: 0.4
k_curve_r: 10

k_speed_q: 0.5
k_speed_r: 1.0

# Low Pass Filter
alpha: 0.9

# RMS History
history_size: 10

# Weight Limits
q_ct_min: 1.0
q_ct_max: 40.0

q_yaw_min: 1.0
q_yaw_max: 20.0

r_steer_min: 0.5
r_steer_max: 20.0

path_resolution: 0.1
future: 90

curve_throttle: 0.01
endcurve_throttle: 0.008
straight_throttle: 0.005

# === Slip-based Adaptive Weight ===
weight_ema_alpha: 0.85

slip_threshold_rad: 0.05236   # 3도
slip_strong_rad:    0.10472   # 6도 (최대 보정 기준)

grip_ratio_threshold: 0.70    # 70% 이하면 저그립으로 판정

# === 고속 진동 억제 (Oscillation Suppression) ===
k_speed_steer: 0.06 # 속도 비례 r_steer 증폭 계수

# 조향 출력 LPF 계수 (0.45 = 고속 직선 털림/진동 완벽 정화)
steer_lpf_alpha: 0.45

# 직선 주행 조향 데드밴드
straight_ct_thresh:  0.10   # m
straight_yaw_thresh: 0.025  # rad (~1.4도)
straight_curve_thresh: 0.003

# === PyTorch param.pt 모델 & 데이터셋 수집 설정 ===
model_filename: "param.pt"          # 학습 모델 파일명 (src/control/model/param.pt)
enable_dataset_logging: false       # 주행 중 학습 데이터셋 (CSV) 자동 저장 활성화
