# Stanley Controller Parameters
#
# ┌─────────────────────────────────────────────────────────────────┐
# │  조향 동작 원리                                                  │
# │  δ = θ_e + arctan(k_e_eff * CTE / (k_v + v))                   │
# │                                                                 │
# │  k_e_eff 결정 (3단계):                                          │
# │    |CTE| < deadband (0.15m)  → k_e * 0.1  ← 직선 진동 억제     │
# │    0.15m ≤ |CTE| < 0.6m     → k_e         ← 기본 복귀          │
# │    |CTE| ≥ 0.6m             → k_e * ~3.0  ← 커브 강한 복귀     │
# │                                                                 │
# │  EMA 필터 (rate limiter 없음):                                  │
# │    직선 모드 (|θ_e| < 4°) → alpha=0.25  강한 평활화             │
# │    커브 모드 (|θ_e| ≥ 4°) → alpha=0.70  빠른 반응               │
# └─────────────────────────────────────────────────────────────────┘

stanley:
  # ---- 기본 게인 -------------------------------------------------------
  k_e: 2.2          # Increased CTE gain for strong centering
  k_v: 1.2          # Balanced speed damping

  # ---- 경로 추종 -------------------------------------------------------
  lookahead_idx: 4  # 100ms 동안 이동거리 보상 (60km/h → 1.67m에 해당)

  # ---- CTE deadband (직선 소진폭 oscillation 억제) --------------------
  cte_deadband:      0.00   # m  (이 이내면 k_e 거의 0)
  cte_deadband_gain: 0.0    # deadband 내 k_e 비율

  # ---- 적응형 CTE boost (커브 복귀) ------------------------------------
  cte_boost_thresh: 0.6    # m  (이 이상이면 k_e 증폭 시작)
  cte_boost_factor: 3.0    # 최대 배율 (|CTE|=1.2m에서 k_e*3.0)

  # ---- CTE 기반 자동 감속 ----------------------------------------------
  cte_speed_limit_thresh: 1.5   # m  (이 이상 벗어나면 감속)
  cte_speed_limit_ratio:  0.6   # target_speed * ratio

  # ---- 모드 적응형 EMA 필터 (rate limiter 없음) ------------------------
  # heading_error가 임계값 이상이면 커브 모드 전환
  heading_curve_thresh_deg: 4.0   # deg

  # 직선 모드: 강한 평활화 → oscillation 억제
  # 0.25 = 현재 raw 25%, 이전 출력 75% 반영
  steer_alpha_straight: 0.25

  # 커브 모드: 빠른 반응 → 튀어나감 방지
  # 0.70 = 현재 raw 70%, 이전 출력 30% 반영
  steer_alpha_curve: 0.70

  # ---- 가속/제동 -------------------------------------------------------
  accel_value: 0.4
  brake_value: 0.0

  # ---- 조향 제한 -------------------------------------------------------
  max_steer_deg: 40.0

  # ---- 제어 주파수 -----------------------------------------------------
  # odom 10 Hz 에 맞춰 10 Hz 로 설정
  # (20 Hz로 설정하면 절반이 낙은 데이터 관리 → 불규칙 행동)
  control_hz: 10.0

  # ---- 인덱스 점프 방지 ------------------------------------------------
  max_idx_jump: 10
